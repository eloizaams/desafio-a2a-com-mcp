[project]
name = "agente"
version = "0.1.0"
description = "Agente de Reservas: servidor A2A e host MCP (a ponte)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "a2a-sdk[http-server]==1.2.2",
    "mcp==2.3.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agente_salas"
