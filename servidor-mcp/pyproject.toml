[project]
name = "servidor-mcp"
version = "0.1.0"
description = "Central de Salas: servidor MCP (Streamable HTTP, stateless, MRTR)"
requires-python = ">=3.10,<3.13"
dependencies = [
    "mcp==2.3.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "central_salas"
